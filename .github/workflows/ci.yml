name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Validate the policy file
        run: python -m src.safeguards.policy_config config/policy.yaml
      - run: pytest -q
      - name: Console eval data is current (demo/data/evals.json)
        run: python scripts/export_console_data.py --check
      - name: Console sample-company data is current (demo/data/sample_company.json)
        run: python scripts/generate_sample_company.py --check
      - name: Generated simulated callers are current (evals/personas_generated.yaml)
        run: python scripts/generate_personas.py --check
      - name: Held-out simulated callers are current (evals/personas_holdout.yaml)
        run: python scripts/generate_personas_holdout.py --check
      - name: Call evals (scorecard in the job summary)
        run: python -m evals.run --json eval-results.json
      - name: Simulated callers, development set (scorecard in the job summary; fails on regressions, not on documented known gaps)
        run: python -m evals.simulate --json simulate-results.json
      - name: Simulated callers, held-out set (scorecard in the job summary; fails on regressions, not on documented known gaps)
        run: python -m evals.simulate --set holdout --json simulate-holdout-results.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: eval-results
          path: |
            eval-results.json
            simulate-results.json
            simulate-holdout-results.json

  console-smoke:
    # Drives every console screen in headless Chromium (scripts/demo_smoke.py): demo mode (Pyodide from the CDN)
    # and live mode (src/console_server.py on a local port; no external services).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-console.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/demo_smoke.py --live --require --screenshots console-screenshots
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: console-screenshots
          path: console-screenshots

  docker:
    # Builds each Dockerfile (no push) and runs one command inside the image, so a base-image update
    # (Dependabot bumps the FROM line) is built and smoke-tested before it merges.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            tag: secure-voice-agent:ci
            smoke: python -c "import src.agent.server" && python -m src.safeguards.policy_config config/policy.yaml
          - dockerfile: Dockerfile.console
            tag: secure-voice-agent-console:ci
            smoke: python -c "import src.console_server" && python -m src.safeguards.policy_config config/policy.yaml
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.dockerfile }}
        run: docker build --file "${{ matrix.dockerfile }}" --tag "${{ matrix.tag }}" .
      - name: Smoke command inside the image
        run: docker run --rm "${{ matrix.tag }}" sh -c '${{ matrix.smoke }}'
