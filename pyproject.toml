[project]
name = "secure-voice-agent"
version = "0.7.0"
description = "Secure Voice Agent: reference architecture and console for a phone AI agent that can move money: deterministic policy gate, step-up verification, policy as code, velocity limits, PII scrubbing, PCI keypad capture, AI disclosure and consent, hash-chained audit, evals, simulated callers, tracing, and a product console (browser demo or local live server). Pipecat + Twilio + AWS Lambda"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Corey Mathie" }]
keywords = ["voice-ai", "pipecat", "twilio", "openai", "realtime", "serverless", "aws-lambda", "ai-agent", "ai-safety", "opentelemetry", "pci", "nist-800-63b", "policy-as-code"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
