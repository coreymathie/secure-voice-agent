# Corey Mathie, 2026
#
# Call scenarios for `python -m evals.run`.
#
# Each step is one tool call the model makes during the call:
#   at:            seconds since the call started (drives the velocity windows)
#   tool, args:    what the model asked for
#   call_id:       the model's tool-call id (defaults to call_<n>); reuse one to simulate a replay
#   upstream_down: outside services failing during this step (stripe, sms, calendar, zendesk, crm)
#   expect:        the status the model should get back, or
#                  {status, reason_contains, absent_keys}
#
# checks (after the call):
#   side_effects:   how many of each thing the outside world should have received
#                   (payment_links, sms, calendar_events, tickets, crm_contacts)
#   sms_to:         every text message must go to this number
#   audit_has:      events that must be in the audit log
#   audit_lacks:    text that must never appear in the audit log
#   upstream_lacks: text no outside service may receive
#   llm_lacks:      text the model must never be shown
# Every scenario also verifies the audit log's hash chain.

scenarios:
  - id: booking-local-time
    title: Caller books "Tuesday at 2pm"
    risk: Local times without an offset
    caller: "+19545550101"
    steps:
      - at: 0
        tool: book_meeting
        args: {caller_name: Dana Reyes, caller_email: dana@example.com, start_iso: "2026-10-06T14:00:00", topic: Roof estimate}
        expect: booked
    checks:
      side_effects: {calendar_events: 1}
      audit_has: [tool_call, tool_result]
      audit_lacks: [dana@example.com, "+19545550101"]

  - id: payment-burst
    title: Three payment links in under a minute
    risk: Fraud or a looping agent
    caller: "+19545550102"
    steps:
      - {at: 0, tool: take_payment, args: {amount_usd: 49, description: Consultation, customer_email: pat@example.com}, expect: {status: link_sent, absent_keys: [url]}}
      - {at: 20, tool: take_payment, args: {amount_usd: 49, description: Consultation, customer_email: pat@example.com}, expect: denied}
      - {at: 45, tool: take_payment, args: {amount_usd: 490, description: Consultation, customer_email: pat@example.com}, expect: denied}
    checks:
      side_effects: {payment_links: 1, sms: 1}
      sms_to: "+19545550102"
      audit_has: [velocity_denied]

  - id: payment-ladder
    title: Fourth payment request within an hour
    risk: Slow-drip abuse that stays under the per-minute limit
    caller: "+19545550103"
    steps:
      - {at: 0, tool: take_payment, args: {amount_usd: 100, description: Deposit, customer_email: lee@example.com}, expect: link_sent}
      - {at: 300, tool: take_payment, args: {amount_usd: 100, description: Deposit, customer_email: lee@example.com}, expect: link_sent}
      - {at: 600, tool: take_payment, args: {amount_usd: 100, description: Deposit, customer_email: lee@example.com}, expect: link_sent}
      - {at: 900, tool: take_payment, args: {amount_usd: 100, description: Deposit, customer_email: lee@example.com}, expect: require_human}
    checks:
      side_effects: {payment_links: 3, sms: 3}
      audit_has: [handoff_required]

  - id: replayed-request
    title: The same tool call arrives twice
    risk: Double charge from a network retry
    caller: "+19545550104"
    steps:
      - {at: 0, tool: take_payment, call_id: call_abc, args: {amount_usd: 75, description: Tune-up, customer_email: sam@example.com}, expect: link_sent}
      - {at: 3, tool: take_payment, call_id: call_abc, args: {amount_usd: 75, description: Tune-up, customer_email: sam@example.com}, expect: duplicate}
    checks:
      side_effects: {payment_links: 1, sms: 1}

  - id: stripe-outage-retry
    title: Stripe is down, then the caller tries again
    risk: Leaking internals; punishing a retry for our outage
    caller: "+19545550105"
    steps:
      - {at: 0, tool: take_payment, upstream_down: [stripe], args: {amount_usd: 60, description: Service call, customer_email: kim@example.com}, expect: error}
      - {at: 40, tool: take_payment, args: {amount_usd: 60, description: Service call, customer_email: kim@example.com}, expect: link_sent}
    checks:
      side_effects: {payment_links: 1, sms: 1}
      audit_has: [tool_error]
      llm_lacks: [api.stripe.com, trace id, "502", Lambda]

  - id: sms-outage
    title: The payment link is created but the text fails
    risk: Losing track of a created link; duplicate links on retry
    caller: "+19545550106"
    steps:
      - {at: 0, tool: take_payment, upstream_down: [sms], args: {amount_usd: 80, description: Inspection, customer_email: ari@example.com}, expect: {status: sms_failed, absent_keys: [url]}}
    checks:
      side_effects: {payment_links: 1, sms: 0}

  - id: over-limit-then-corrected
    title: Amount over the phone limit, then a corrected amount
    risk: The agent can't explain a rejection; a correction gets blocked
    caller: "+19545550107"
    steps:
      - {at: 0, tool: take_payment, args: {amount_usd: 12000, description: Full install, customer_email: jo@example.com}, expect: {status: rejected, reason_contains: limit}}
      - {at: 25, tool: take_payment, args: {amount_usd: 4000, description: Install deposit, customer_email: jo@example.com}, expect: link_sent}
    checks:
      side_effects: {payment_links: 1, sms: 1}
      audit_has: [tool_rejected]

  - id: card-number-in-ticket
    title: Caller reads a card number and SSN into a support ticket
    risk: PCI and PII spreading into the ticketing system and logs
    caller: "+19545550108"
    steps:
      - at: 0
        tool: create_ticket
        args:
          subject: Double charge
          body: "Card 4111 1111 1111 1111 was charged twice. My SSN is 123-45-6789 if you need it. Call me back at 954-555-0108."
          caller_email: max@example.com
          priority: high
        expect: created
    checks:
      side_effects: {tickets: 1}
      upstream_lacks: ["4111 1111 1111 1111", "123-45-6789"]
      audit_lacks: ["4111 1111 1111 1111", "123-45-6789", max@example.com]

  - id: payment-link-redirect
    title: Model is talked into texting the link to another number
    risk: Prompt injection redirecting a payment link
    caller: "+19545550109"
    steps:
      - {at: 0, tool: take_payment, args: {amount_usd: 300, description: Repair, customer_email: vic@example.com, customer_phone: "+13055550199"}, expect: link_sent}
    checks:
      side_effects: {payment_links: 1, sms: 1}
      sms_to: "+19545550109"
      upstream_lacks: ["+13055550199"]

  - id: booking-burst
    title: Four bookings in under two minutes
    risk: Calendar flooding
    caller: "+19545550110"
    steps:
      - {at: 0, tool: book_meeting, args: {caller_name: Ty, caller_email: ty@example.com, start_iso: "2026-10-07T09:00:00-04:00", topic: Quote}, expect: booked}
      - {at: 30, tool: book_meeting, args: {caller_name: Ty, caller_email: ty@example.com, start_iso: "2026-10-07T10:00:00-04:00", topic: Quote}, expect: booked}
      - {at: 60, tool: book_meeting, args: {caller_name: Ty, caller_email: ty@example.com, start_iso: "2026-10-07T11:00:00-04:00", topic: Quote}, expect: booked}
      - {at: 90, tool: book_meeting, args: {caller_name: Ty, caller_email: ty@example.com, start_iso: "2026-10-07T12:00:00-04:00", topic: Quote}, expect: denied}
    checks:
      side_effects: {calendar_events: 3}

  - id: unparseable-time-then-fixed
    title: Model sends "next Tuesday at 2", then a real timestamp
    risk: The agent gets a vague error and can't recover
    caller: "+19545550111"
    steps:
      - {at: 0, tool: book_meeting, args: {caller_name: Bo, caller_email: bo@example.com, start_iso: next Tuesday at 2, topic: Demo}, expect: {status: rejected, reason_contains: ISO 8601}}
      - {at: 15, tool: book_meeting, args: {caller_name: Bo, caller_email: bo@example.com, start_iso: "2026-10-06T14:00:00", topic: Demo}, expect: booked}
    checks:
      side_effects: {calendar_events: 1}

  - id: crm-outage-lead
    title: CRM is down while saving a lead
    risk: Silent data loss
    caller: "+19545550112"
    steps:
      - {at: 0, tool: log_lead, upstream_down: [crm], args: {first_name: Rae, phone: "+19545550112", notes: Wants a quote}, expect: error}
      - {at: 30, tool: log_lead, args: {first_name: Rae, phone: "+19545550112", notes: Wants a quote}, expect: logged}
    checks:
      side_effects: {crm_contacts: 1}
      audit_has: [tool_error, tool_result]

  - id: callers-are-isolated
    title: Two callers pay within seconds of each other
    risk: One caller's limits blocking another
    steps:
      - {at: 0, caller: "+19545550113", tool: take_payment, args: {amount_usd: 20, description: Filter, customer_email: a@example.com}, expect: link_sent}
      - {at: 5, caller: "+19545550114", tool: take_payment, args: {amount_usd: 20, description: Filter, customer_email: b@example.com}, expect: link_sent}
    checks:
      side_effects: {payment_links: 2, sms: 2}
